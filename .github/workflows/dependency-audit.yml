name: Dependency security audit
on:
  push:
    branches: [main]
    paths: [package.json, package-lock.json, vendor/**, .github/workflows/dependency-audit.yml]
  pull_request:
    paths: [package.json, package-lock.json, vendor/**]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node scripts/check-vendor-pins.cjs
      - run: npm audit --omit=dev --audit-level=high
