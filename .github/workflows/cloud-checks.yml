name: Cloud sync checks
on:
  push:
    branches: [main]
    paths: [src/cloud/**, cloud/**, tsconfig.cloud.json, package.json, package-lock.json, scripts/check-cloud-core.mjs, .github/workflows/cloud-checks.yml]
  pull_request:
    paths: [src/cloud/**, cloud/**, tsconfig.cloud.json, package.json, package-lock.json, scripts/check-cloud-core.mjs, .github/workflows/cloud-checks.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm ci
      - run: npm run build:cloud
      - run: git diff --exit-code -- cloud
      - run: npm run test:cloud:core
