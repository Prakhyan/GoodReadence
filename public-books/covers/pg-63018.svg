<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900"><title>The Power of Conscience, exemplified in the genuine and extraordinary confession of Thomas Bedworth delivered to one of the principal officers of Newgate, the night before his execution on September 18, 1815, for the murder of Elizabeth Beesmore in Drury lane. Relating his horrible sufferings until compelled to surrender to public justice by the constant supernatural visitations of the murdered woman, and the frequent appearance of her apparition. From the original paper now in the possession of the publisher. Including interesting particulars of Bedworth&apos;s former life, his behaviour before execution, and an original and full report of the Common Serjeant&apos;s address on passing sentence. by Thomas Bedworth</title><desc>Original GoodReadence display cover. The source edition is unchanged.</desc><defs><pattern id="cloth" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0h6M0 3h6M0 0v6M3 0v6" stroke="#ffffff" stroke-opacity=".035" stroke-width=".6"/></pattern><linearGradient id="spine"><stop stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient></defs><rect width="600" height="900" rx="7" fill="#183c50"/><rect width="600" height="900" rx="7" fill="url(#cloth)"/><rect width="28" height="900" fill="url(#spine)"/><g fill="none" stroke="#ddc998"><rect x="34" y="30" width="534" height="840" rx="3" opacity=".7"/><rect x="43" y="39" width="516" height="822" rx="2" stroke-width=".7" opacity=".45"/><path d="M58 88h484M58 812h484" opacity=".5"/></g><g text-anchor="middle" fill="#f4eddb" font-family="Georgia,Times New Roman,serif"><text x="300" y="119" font-family="Arial,sans-serif" font-size="12" letter-spacing="3" opacity=".7">MYSTERY</text><text x="300" y="63.9" font-size="26">The Power of Conscience, exemplified</text><text x="300" y="94.6" font-size="26">in the genuine and extraordinary</text><text x="300" y="125.2" font-size="26">confession of Thomas Bedworth</text><text x="300" y="155.9" font-size="26">delivered to one of the principal</text><text x="300" y="186.6" font-size="26">officers of Newgate, the night before</text><text x="300" y="217.3" font-size="26">his execution on September 18, 1815,</text><text x="300" y="248.0" font-size="26">for the murder of Elizabeth Beesmore</text><text x="300" y="278.6" font-size="26">in Drury lane. Relating his horrible</text><text x="300" y="309.3" font-size="26">sufferings until compelled to surrender</text><text x="300" y="340.0" font-size="26">to public justice by the constant</text><text x="300" y="370.7" font-size="26">supernatural visitations of the</text><text x="300" y="401.4" font-size="26">murdered woman, and the frequent</text><text x="300" y="432.0" font-size="26">appearance of her apparition. From the</text><text x="300" y="462.7" font-size="26">original paper now in the possession of</text><text x="300" y="493.4" font-size="26">the publisher. Including interesting</text><text x="300" y="524.1" font-size="26">particulars of Bedworth&apos;s former life,</text><text x="300" y="554.8" font-size="26">his behaviour before execution, and an</text><text x="300" y="585.4" font-size="26">original and full report of the Common</text><text x="300" y="616.1" font-size="26">Serjeant&apos;s address on passing sentence.</text><text x="300" y="754" font-size="20" letter-spacing=".5">Thomas Bedworth</text><text x="300" y="841" font-family="Arial,sans-serif" font-size="10" letter-spacing="3" opacity=".55">THE CLASSICS COLLECTION</text></g><g color="#ddc998" opacity=".82"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M242 706V590a58 58 0 0 1 116 0v116ZM260 706V590a40 40 0 0 1 80 0v116ZM300 551v140M242 622h116"/><circle cx="300" cy="629" r="12"/><path d="m296 641-8 31h24l-8-31"/><path d="M220 710h160"/></g></g></svg>