<!-- Original GoodReadence ribbon monogram. CC0 1.0 dedication. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="GoodReadence">
  <defs>
    <linearGradient id="gr-plum" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="87" y2="96">
      <stop stop-color="#795798"/>
      <stop offset=".48" stop-color="#593783"/>
      <stop offset="1" stop-color="#3b2559"/>
    </linearGradient>
    <linearGradient id="gr-edge" x2="1" y2="1">
      <stop stop-color="#fff" stop-opacity=".25"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#1f1035" stop-opacity=".22"/>
    </linearGradient>
  </defs>
  <rect id="gr-tile" width="96" height="96" rx="24" fill="url(#gr-plum)"/>
  <rect id="gr-keyline" x=".6" y=".6" width="94.8" height="94.8" rx="23.4" fill="none" stroke="url(#gr-edge)" stroke-width=".8"/>
  <g id="gr-symbol" transform="translate(6 2)" fill="none" stroke="#fffdfa" stroke-linecap="round" stroke-linejoin="round">
    <path d="M66 29a27 27 0 1 0 -18 43" stroke-width="6.25"/>
    <path d="M48 49h19v23L57 65l-9 7Z" stroke-width="3.5"/>
  </g>
</svg>
